  --kd-border-transition-base:  border-color 0.2s cubic-bezier(0.645, 0.045, 0.355, 1);

  --kd-font-size-xs:  var(--kd-font-size-extra-small);

  --kd-color-oversea-member-primary-normal:  linear-gradient(120deg, var(--indigo-kd-color-indigo-7, #7F45F6) 3.13%, var(--blue-kd-color-blue-6, #0A6CFF) 51.19%, var(--azure-kd-color-azure-4, #50C8F2) 104.59%);

  --kd-color-state-pressed-brand-filter: invert(37%) sepia(95%) saturate(4253%) hue-rotate(209deg) brightness(99%) contrast(107%);

/* ===== reset.css ===== */
/* @kd-registry: reset v2.0 */
/* ══════════════════════════════════════════════════════════════
   KDesign 全局重置
   ══════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  font-size: var(--kd-font-size-base);
  color: var(--kd-color-text-primary);
  background: var(--kd-color-background-base);
  -webkit-font-smoothing: antialiased;
}

a { text-decoration: none; color: inherit; }
button { border: none; background: transparent; font: inherit; color: inherit; cursor: pointer; }
input, textarea, select { min-width: 0; max-width: 100%; }
img, video, canvas, svg { max-width: 100%; }

/* ===== material.css ===== */
/* @kd-registry: material v1.1 */
/* ================================================================
   KDesign Material System
   材质体系 — 模糊 + 背景 + 双层边框 + 内发光 复合效果
   规格来源：kd-foundation/materials.md
   ================================================================ */

/* ── Shared base ─────────────────────────────────────────────── */

.kd-material-group,
.kd-material-plate,
.kd-material-base,
.kd-material-group--solid,
.kd-material-plate--solid,
.kd-material-base--solid,
.kd-material-ribbon,
.kd-material-ai-input {
  position: relative;
  isolation: isolate;
  /* Stroke 双层边框：内白边 + 四边等宽外灰环（--kd-material-stroke-ring → extra-small），置于 root 避免被 ::before opacity 稀释；圆角由宿主容器自行定义，材质层 inherit 跟随 */
  border: 1px solid var(--kd-color-fill-base, #fff);
  box-shadow: var(--kd-material-stroke-ring);
}

.kd-material-group::before,
.kd-material-plate::before,
.kd-material-base::before,
.kd-material-group--solid::before,
.kd-material-plate--solid::before,
.kd-material-base--solid::before,
.kd-material-ribbon::before,
.kd-material-ai-input::before,
.kd-material-group::after,
.kd-material-plate::after,
.kd-material-base::after,
.kd-material-group--solid::after,
.kd-material-plate--solid::after,
.kd-material-base--solid::after,
.kd-material-ribbon::after,
.kd-material-ai-input::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  box-sizing: content-box;
}

.kd-material-group::before,
.kd-material-plate::before,
.kd-material-base::before,
.kd-material-group--solid::before,
.kd-material-plate--solid::before,
.kd-material-base--solid::before,
.kd-material-ribbon::before,
.kd-material-ai-input::before {
  z-index: 0;
}

.kd-material-group::after,
.kd-material-plate::after,
.kd-material-base::after,
.kd-material-group--solid::after,
.kd-material-plate--solid::after,
.kd-material-base--solid::after,
.kd-material-ribbon::after,
.kd-material-ai-input::after {
  z-index: 0;
}

/* 内容层置于材质伪元素之上 */
.kd-material-group > *,
.kd-material-plate > *,
.kd-material-base > *,
.kd-material-group--solid > *,
.kd-material-plate--solid > *,
.kd-material-base--solid > *,
.kd-material-ribbon > *,
.kd-material-ai-input > * {
  position: relative;
  z-index: 1;
}

/* ── 通用材质 · 模糊 ────────────────────────────────────────── */

/* --- group (模糊 · 聚焦) --- */
.kd-material-group {
  backdrop-filter: blur(var(--kd-material-group-blur, 8px));
  -webkit-backdrop-filter: blur(var(--kd-material-group-blur, 8px));
}

.kd-material-group::before {
  background: var(--kd-color-background-group);
  opacity: var(--kd-material-bg-opacity-focus, 0.8);
  border: none;
  box-shadow: none;
  z-index: 0;
}

.kd-material-group::after {
  opacity: var(--kd-material-glow-opacity, 0.2);
  box-shadow: inset 0px 8px 32px 0px var(--kd-color-fill-base, #fff);
  z-index: 0;
}

/* --- group (模糊 · 失焦) --- */
.kd-material-group.kd-material-group--unfocus {
  border-color: rgba(255, 255, 255, var(--kd-material-stroke-opacity-unfocus, 0.2));
}

.kd-material-group.kd-material-group--unfocus::before {
  opacity: var(--kd-material-bg-opacity-unfocus, 0.7);
}

.kd-material-group.kd-material-group--unfocus::after {
  opacity: 0;
}

/* --- plate (模糊 · 聚焦) --- */
.kd-material-plate {
  backdrop-filter: blur(var(--kd-material-blur, 20px));
  -webkit-backdrop-filter: blur(var(--kd-material-blur, 20px));
}

.kd-material-plate::before {
  background: var(--kd-color-background-plate);
  opacity: var(--kd-material-bg-opacity-focus, 0.8);
  border: none;
  box-shadow: none;
  z-index: 0;
}

.kd-material-plate::after {
  opacity: var(--kd-material-glow-opacity, 0.2);
  box-shadow: inset 0px 8px 32px 0px var(--kd-color-fill-base, #fff);
  z-index: 0;
}

/* --- plate (模糊 · 失焦) --- */
.kd-material-plate.kd-material-plate--unfocus {
  border-color: rgba(255, 255, 255, var(--kd-material-stroke-opacity-unfocus, 0.2));
}

.kd-material-plate.kd-material-plate--unfocus::before {
  opacity: var(--kd-material-bg-opacity-unfocus, 0.7);
}

.kd-material-plate.kd-material-plate--unfocus::after {
  opacity: 0;
}

/* --- base (模糊 · 聚焦) --- */
.kd-material-base {
  backdrop-filter: blur(var(--kd-material-blur, 20px));
  -webkit-backdrop-filter: blur(var(--kd-material-blur, 20px));
}

.kd-material-base::before {
  background: var(--kd-color-background-base);
  opacity: var(--kd-material-bg-opacity-focus, 0.8);

  box-shadow: none;

}

.kd-material-base::after {
  opacity: var(--kd-material-glow-opacity, 0.2);
  box-shadow: inset 0px 8px 32px 0px var(--kd-color-fill-base, #fff);
  z-index: 0;
}

/* --- base (模糊 · 失焦) --- */
.kd-material-base.kd-material-base--unfocus {
  border-color: rgba(255, 255, 255, var(--kd-material-stroke-opacity-unfocus, 0.2));
}

.kd-material-base.kd-material-base--unfocus::before {
  opacity: var(--kd-material-bg-opacity-unfocus, 0.7);
}

.kd-material-base.kd-material-base--unfocus::after {
  opacity: 0;
}

/* ── 通用材质 · 实色 ────────────────────────────────────────── */

/* --- group/实色 --- */
.kd-material-group--solid::before {
  background: var(--kd-color-background-group);
  border: none;
  box-shadow: none;
  z-index: 0;
}

.kd-material-group--solid::after {
  opacity: var(--kd-material-glow-opacity, 0.2);
  box-shadow: inset 0px 8px 32px 0px var(--kd-color-fill-base, #fff);
  z-index: 0;
}

/* --- plate/实色 --- */
.kd-material-plate--solid::before {
  background: var(--kd-color-background-plate);

  box-shadow: none;

}

.kd-material-plate--solid::after {

  box-shadow: inset 0px 8px 32px 0px var(--kd-color-fill-base, #fff);
  z-index: 0;
}

/* --- base/实色 --- */
.kd-material-base--solid::before {
  background: var(--kd-color-background-base);
  border: none;
  box-shadow: none;
  z-index: 0;
}

.kd-material-base--solid::after {
  opacity: var(--kd-material-glow-opacity, 0.2);
  box-shadow: inset 0px 8px 32px 0px var(--kd-color-fill-base, #fff);
  z-index: 0;
}

/* ── 专用材质 ────────────────────────────────────────────────── */

/* --- Ribbon (聚焦) --- */
.kd-material-ribbon {
  backdrop-filter: blur(var(--kd-material-blur, 20px));
  -webkit-backdrop-filter: blur(var(--kd-material-blur, 20px));
}

.kd-material-ribbon::before {
  background: var(--kd-color-background-group);
  opacity: var(--kd-material-bg-opacity-focus, 0.8);
  border: none;
  box-shadow: none;
  z-index: 0;
}

.kd-material-ribbon::after {
  opacity: var(--kd-material-glow-opacity, 0.2);
  box-shadow: inset 0px 8px 32px 0px var(--kd-color-fill-base, #fff);
  z-index: 0;
}

/* --- Ribbon (失焦) --- */

  border-color: rgba(255, 255, 255, var(--kd-material-stroke-opacity-unfocus, 0.2));
}

.kd-material-ribbon.kd-material-ribbon--unfocus::before {

}

.kd-material-ribbon.kd-material-ribbon--unfocus::after {

}

/* --- AI Input (聚焦) --- */
.kd-material-ai-input {
  backdrop-filter: blur(var(--kd-material-blur, 20px));
  -webkit-backdrop-filter: blur(var(--kd-material-blur, 20px));
}

.kd-material-ai-input::before {
  background: var(--kd-color-fill-base, #fff);
  border: none;
  box-shadow: none;
  z-index: 0;
}

.kd-material-ai-input::after {
  opacity: var(--kd-material-glow-opacity, 0.2);
  box-shadow: inset 0px 8px 32px 0px var(--kd-color-fill-base, #fff);
  z-index: 0;
}

/* ── Popup panel integration ─────────────────────────────────── */
/* 弹出层面板挂载材质时，仅移除旧版实底；双层边框由材质接管，外投影由集成层按需声明。
   border 必须在这里重申一次：宿主组件（.kd-menu / .kd-popover-content 等）自己写的
   `border: 1px solid var(--kd-color-line-*)` 与 Shared base 的 `.kd-material-*` 同为
   (0,1,0) 特异度，谁后加载谁生效 —— 页面按需拼接 CSS 时顺序不固定，内白边会被灰边盖掉。
   复合选择器 (0,2,0) 让描边结果不再依赖加载顺序。 */

.kd-cascader-dropdown.kd-material-group,
.kd-date-picker-panel.kd-material-group,
.kd-dropdown-panel.kd-material-group,
.kd-menu.kd-material-group,
.kd-popover-content.kd-material-group,
.kd-time-picker-panel.kd-material-group {
  background: transparent;
  border: 1px solid var(--kd-color-fill-base, #fff);
  box-shadow: var(--kd-material-stroke-ring), var(--kd-box-shadow-large);
  backdrop-filter: blur(var(--kd-material-group-blur, 8px));
  -webkit-backdrop-filter: blur(var(--kd-material-group-blur, 8px));
}

/* kd-material-group 默认 position:relative，会覆盖弹出层 absolute 定位 */
.kd-cascader-dropdown.kd-material-group,
.kd-date-picker-panel.kd-material-group,
.kd-time-picker-panel.kd-material-group {
  position: absolute;
}

.kd-date-picker-panel.kd-material-group {
  overflow: visible;
}

.kd-time-picker-panel.kd-material-group {
  overflow: hidden;
}

/* 弹出面板箭头：完整样式由 popover.css 定义（8×8 旋转方块） */

/* 侧边面板：group/实色 材质，无外投影（常驻布局面板） */
.kd-side-panel.kd-material-group--solid {
  background: transparent;
  border: 1px solid var(--kd-color-fill-base, #fff);
  box-shadow: var(--kd-material-stroke-ring);
}

.kd-side-panel.kd-material-group--solid > .kd-side-panel-resizer {
  position: absolute;
  z-index: 2;
}

/* primary 引导弹层保留自定义色底板，不使用 group 材质 */
.kd-popover-content.kd-user-guide-popover--primary {
  border: 1px solid rgba(var(--kd-color-line-regular), 1);
}

/* 对话框：base 材质 + 对话框外投影。--solid 为无模糊版，叠在深色遮罩上时底色不被压暗 */
.kd-modal-content.kd-material-base,
.kd-modal-content.kd-material-base--solid {
  background: transparent;
  border: 1px solid var(--kd-color-fill-base, #fff);
  box-shadow: var(--kd-material-stroke-ring), var(--kd-box-shadow-extra-large);
  overflow: visible;
}

/* ===== button.css ===== */
/* @kd-registry: button v2.2 */
/* ══ Button 按钮 ══ */

.kd-button {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 6px;
  font-family: inherit; font-weight: var(--kd-font-weight-regular);
  line-height: 1;
  border: 1px solid transparent; border-radius: var(--kd-border-radius-large);
  cursor: pointer; white-space: nowrap; user-select: none; outline: none;
  box-sizing: border-box; vertical-align: middle;
  transition: background-color var(--kd-time-fast) var(--kd-easing-ease),
              border-color var(--kd-time-fast) var(--kd-easing-ease),
              color var(--kd-time-fast) var(--kd-easing-ease),
              opacity var(--kd-time-fast) var(--kd-easing-ease);
}
.kd-button > span {
  display: inline-flex;
  align-items: center;
}
.kd-button-children { display: inline-flex; align-items: center; }
.kd-button-prefix-icon,
.kd-button-suffix-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  line-height: 0;
}
.kd-button-prefix-icon .kd-icon,
.kd-button-prefix-icon svg,
.kd-button-suffix-icon .kd-icon,
.kd-button-suffix-icon svg {
  display: block;
  width: 16px;
  height: 16px;
  max-width: none;
}

/* Size */
.kd-button-xs { height: 20px; padding: 0 3px;    font-size: var(--kd-font-size-small); border-radius: var(--kd-border-radius-small); }
.kd-button-s { height: 24px; padding: 0 5px;    font-size: var(--kd-font-size-sub-base); border-radius: var(--kd-border-radius-middle); }
.kd-button-icon.kd-button-s { border-radius: 5px; }
.kd-button-m  { height: 28px; padding: 0 11px;   font-size: var(--kd-font-size-sub-base); }
.kd-button-l { height: 32px; padding: 0 15px;   font-size: var(--kd-font-size-sub-base); }
.kd-button-xl { height: 36px; padding: 0 19px;   font-size: var(--kd-font-size-middle); }
.kd-button-light.kd-button-m { padding: 0 8px; }

/* Primary */
.kd-button-primary {
  background: var(--kd-color-public-normal);
  color: var(--kd-color-text-white);
  border-color: var(--kd-color-public-pressed);
  --kd-color-icon-primary: currentColor;
  --kd-color-icon-secondary: currentColor;
  --kd-color-icon-white: currentColor;
}
.kd-button-primary:hover:not(:disabled) {
  background: var(--kd-color-public-hover);
  border-color: var(--kd-color-public-normal);
}
.kd-button-primary:active:not(:disabled) { background: var(--kd-color-public-pressed); }
.kd-button-primary:not(.kd-button-icon) { min-width: 72px; }

/* Primary highlight ring — token color with opacity isolated to the overlay. */
.kd-button-primary {
  position: relative;
}
.kd-button-primary::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  box-shadow: inset 0 0 0 1px var(--kd-color-line-white);
  opacity: 0.1;
  pointer-events: none;
}

/* Secondary */
.kd-button-secondary { background: var(--kd-color-fill-base); color: var(--kd-color-text-primary); border-color: var(--kd-color-line-regular); }
.kd-button-secondary:hover:not(:disabled)  { background: var(--kd-color-fill-light); }
.kd-button-secondary:active:not(:disabled) { background: var(--kd-color-fill-regular); }
.kd-button-secondary:not(.kd-button-icon) { min-width: 72px; }

/* Light */
.kd-button-light { background: transparent; color: var(--kd-color-text-primary); }
.kd-button-light:hover:not(:disabled)  { background: var(--kd-color-state-hover); }
.kd-button-light:active:not(:disabled) { background: var(--kd-color-state-pressed); }

/* Danger */
.kd-button-light.kd-button-danger  { color: var(--kd-color-error-normal); }
.kd-button-primary.kd-button-danger {
  background: var(--kd-color-error-normal);
  border-color: var(--kd-color-error-pressed);
}
.kd-button-primary.kd-button-danger:hover:not(:disabled) {
  background: var(--kd-color-error-hover);
  border-color: var(--kd-color-error-normal);
}
.kd-button-primary.kd-button-danger:active:not(:disabled) { background: var(--kd-color-error-pressed); }
.kd-button-secondary.kd-button-danger { color: var(--kd-color-text-error); border-color: var(--kd-color-line-error); }

/* Highlight (active / toggled state) */
.kd-button-highlight { color: var(--kd-color-text-public); border-color: var(--kd-color-line-public); }
.kd-button-light.kd-button-highlight { border-color: transparent; }

/* Disabled */
.kd-button:disabled { opacity: var(--kd-opacity-disabled); cursor: not-allowed; pointer-events: none; }
.kd-button-secondary:disabled { border-color: var(--kd-color-line-medium); }

/* Loading */
.kd-button-loading {
  cursor: not-allowed;
  pointer-events: none;
}
.kd-button-loading .kd-button-loading-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  line-height: 0;
  color: var(--kd-color-icon-info);
  animation: kd-button-loading-spin 1s linear infinite;
}
.kd-button-loading .kd-button-loading-icon svg {
  display: block;
  width: 16px;
  height: 16px;
}
.kd-button-primary .kd-button-loading-icon {
  color: var(--kd-color-text-white);
}
@keyframes kd-button-loading-spin {
  to { transform: rotate(360deg); }
}
@media (prefers-reduced-motion: reduce) {
  .kd-button-loading .kd-button-loading-icon { animation-duration: 2s; }
}

/* Icon-only */
.kd-button-icon.kd-button-xs { min-width: 20px; padding: 0 2px; }
.kd-button-icon.kd-button-s { min-width: 24px; padding: 0 3px; }
.kd-button-icon.kd-button-m  { min-width: 28px; padding: 0 5px; }
.kd-button-icon.kd-button-l { min-width: 32px; padding: 0 7px; }
.kd-button-icon.kd-button-xl { min-width: 36px; padding: 0 9px; }

.kd-button-icon .kd-icon,
.kd-button-icon > svg {
  width: 16px;
  height: 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  line-height: 0;
}
.kd-button-icon .kd-icon svg,
.kd-button-icon > svg {
  display: block;
  width: 16px;
  height: 16px;
  max-width: none;
}

/* Icon color inheritance — primary forces white on all nested icons */
.kd-button-primary .kd-button-prefix-icon,
.kd-button-primary .kd-button-suffix-icon,
.kd-button-primary.kd-button-icon,
.kd-button-primary .kd-button-icon-content {
  color: var(--kd-color-text-white);
}
.kd-button-primary .kd-button-prefix-icon svg,
.kd-button-primary .kd-button-suffix-icon svg,
.kd-button-primary.kd-button-icon svg,
.kd-button-primary .kd-button-icon-content svg {
  color: inherit;
}
.kd-button-primary [class*="kd-color-icon-"] {
  fill: currentColor !important;
  stroke: currentColor !important;
}
.kd-button-primary svg path[fill="none"] {
  fill: none !important;
}

/*
 * Menu button（菜单按钮）
 * Figma：KDMenuButton
 * React：Button dropdown
 * Vue3：KdButton menu
 * Vue2：KdMenuButton
 */
.kd-button-menu {
  max-width: 100%;
  min-width: 0;
  overflow: hidden;
  gap: 4px;
}
.kd-button-menu .kd-button-menu-main {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  min-width: 0;
  flex: 1 1 auto;
}
.kd-button-menu .kd-button-children {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
  flex: 1 1 0;
  display: block;
  line-height: inherit;
}
.kd-button-menu .kd-button-prefix-icon { flex-shrink: 0; }
.kd-button-menu .kd-button-suffix-icon {
  flex-shrink: 0;
  transition: transform var(--kd-time-fast) var(--kd-easing-ease);
}
.kd-button-menu .kd-button-suffix-icon .kd-icon,
.kd-button-menu .kd-button-suffix-icon svg {
  width: 12px;
  height: 12px;
}
.kd-button-menu .kd-button-prefix-icon .kd-icon,
.kd-button-menu .kd-button-prefix-icon svg {
  width: 16px;
  height: 16px;
}
.kd-button-menu.is-active .kd-button-suffix-icon,
.kd-button-menu.is-open .kd-button-suffix-icon,
.kd-button-menu[aria-expanded="true"] .kd-button-suffix-icon {
  transform: rotate(180deg);
}

/* Menu button per-size asymmetric padding (Vue3 parity) */
.kd-button-menu.kd-button-m:not(.kd-button-light) { padding-inline: 11px 7px; }
.kd-button-menu.kd-button-m.kd-button-light { padding-inline: 7px 5px; }
.kd-button-menu.kd-button-s { padding-inline: 5px 3px; }
.kd-button-menu.kd-button-l { padding-inline: 15px 11px; }
.kd-button-menu.kd-button-xl { padding-inline: 19px 15px; }

/* Menu button icon-only variant */
.kd-button-menu.kd-button-icon.kd-button-s { padding-inline: 3px 1px; }
.kd-button-menu.kd-button-icon.kd-button-m  { padding-inline: 5px 7px; }
.kd-button-menu.kd-button-icon.kd-button-l { padding-inline: 7px 5px; }
.kd-button-menu.kd-button-icon.kd-button-xl { padding-inline: 9px 7px; }

/* ══ Button Group 按钮组 ══ */
.kd-button-group {
  display: inline-flex;
  vertical-align: middle;
}
.kd-button-group > .kd-button {
  position: relative;
}
.kd-button-group > .kd-button + .kd-button {
  margin-inline-start: -1px;
}
.kd-button-group > .kd-button:first-child {
  border-start-end-radius: 0;
  border-end-end-radius: 0;
}
.kd-button-group > .kd-button:last-child {
  border-start-start-radius: 0;
  border-end-start-radius: 0;
}
.kd-button-group > .kd-button:not(:first-child):not(:last-child) {
  border-radius: 0;
}
.kd-button-group > .kd-button:first-child:last-child {
  border-radius: var(--kd-border-radius-large);
}
.kd-button-group > .kd-button:hover,
.kd-button-group > .kd-button:focus,
.kd-button-group > .kd-button:active,
.kd-button-group > .kd-button.is-active {
  z-index: 1;
}
.kd-button-group > .kd-button:disabled {
  z-index: 1;
}

/* ===== modal.css ===== */
/* @kd-registry: modal v2.1 */
/* ══ Modal 对话框 ══ */

/* Mask */
.kd-modal-mask {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.45); z-index: 999;
}
.kd-modal-wrap {
  position: fixed; inset: 0; z-index: 1000;
  display: flex; align-items: center; justify-content: center;
}

/* Shell sizes */
.kd-modal-sm .kd-modal-content { width: 480px; }
.kd-modal-md .kd-modal-content { width: 640px; }
.kd-modal-lg .kd-modal-content { width: 800px; }

/* Content shell — 视觉由 .kd-material-base 材质承担 */
.kd-modal-content {
  border-radius: var(--kd-border-radius-extra-large);
  box-sizing: border-box;
  overflow: hidden;
  animation: kd-modal-in .3s ease forwards;
}
@keyframes kd-modal-in {
  from { opacity: 0; transform: translateY(-20px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Header */
.kd-modal-header {
  display: flex; align-items: center; justify-content: space-between;
  height: 44px; padding: 10px 12px 0 16px; gap: 4px;
}
.kd-modal-title {
  font-size: var(--kd-font-size-base); font-weight: var(--kd-font-weight-bold);
  line-height: var(--kd-line-height-base); color: var(--kd-color-text-primary);
}
.kd-modal-close {
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  border: none; background: transparent;
  border-radius: var(--kd-border-radius-small); cursor: pointer;
  color: var(--kd-color-icon-secondary);
  transition: background var(--kd-time-fast);
}
.kd-modal-close:hover { background: var(--kd-color-state-hover); }

/* ── C1/C2：内容区直接在底板上 ── */
.kd-modal-body-wrap { padding: 4px 16px 8px; }

/* ── C3：wrap padding 更窄（留给白卡片自身 padding） ── */
.kd-modal-body-wrap-c3 { padding: 0 16px; }

/* Tabs 置于 Header 和白卡片之间（仅 C3b） */
.kd-modal-body-wrap .kd-tabs { padding-bottom: 8px; }

/* ── C3 白色内容卡片 ── */
.kd-modal-body-card {
  background: var(--kd-color-background-group);
  border-radius: var(--kd-border-radius-extra-large);
  padding: 12px;
}

/* C3a 多卡片容器 */
.kd-modal-body-multi { display: flex; flex-direction: column; gap: 8px; }
.kd-modal-body-card-c3 { padding: 12px; }

/* Sections */
.kd-modal-section { display: flex; flex-direction: column; gap: 4px; }
.kd-modal-section + .kd-modal-section { margin-top: 16px; }
.kd-modal-section-title {
  font-size: var(--kd-font-size-sub-base); font-weight: var(--kd-font-weight-bold);
  line-height: 20px; color: var(--kd-color-text-primary);
}

/* Field label (400, not bold) */
.kd-field-label {
  font-size: var(--kd-font-size-sub-base); font-weight: var(--kd-font-weight-regular);
  line-height: 20px; color: var(--kd-color-text-primary);
}

/* Footer */
.kd-modal-footer {
  display: flex; align-items: center;
  gap: 16px; padding: 16px;
  justify-content: flex-end;
}
.kd-modal-footer.has-left { justify-content: space-between; }
.kd-modal-footer-left,
.kd-modal-footer-right { display: flex; align-items: center; gap: 8px; }
.kd-modal-footer-left:empty { display: none; }
/* 右侧按钮组始终靠右：has-left 配空左侧容器时，:empty 的 display:none 会让

.kd-modal-footer-right { margin-inline-start: auto; }

  border: 1px solid var(--kd-color-state-hover);

.kd-tag--error   { background: var(--kd-color-error-light);   border-color: var(--kd-color-error-normal);   color: var(--kd-color-error-pressed); }
.kd-tag--warning { background: var(--kd-color-warning-light); border-color: var(--kd-color-warning-normal); color: #C25010; }
.kd-tag--info    { background: var(--kd-color-info-light);     border-color: var(--kd-color-public-normal);  color: var(--kd-color-public-pressed); }

  width: 16px; height: 16px; border: none; background: transparent;
  cursor: pointer; border-radius: var(--kd-border-radius-small);
  color: var(--kd-color-icon-secondary); padding: 0;
}
.kd-tag-close:hover { background: var(--kd-color-state-pressed); }
.kd-tag-close svg { display: block; width: 16px; height: 16px; }

.kd-tag__prefix {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 16px;
  width: 16px;
  height: 16px;
  color: currentColor;

.kd-tag--checkable { cursor: pointer; user-select: none; }
.kd-tag--checkable:hover:not(.is-disabled) { background: var(--kd-color-state-pressed); }
.kd-tag--checkable.is-checked {
  background: var(--kd-color-public-light);
  border-color: var(--kd-color-public-normal);
  color: var(--kd-color-public-pressed);

  opacity: var(--kd-opacity-disabled);
  cursor: not-allowed;
}

<script>const DATA={"paths":[{"id":"path-0","display_name":"权益已覆盖：直接继续","kind":"journey","nodes":["functional","rights","continue","execute","goal"],"edges":["functional_rights","rights_usable","no_extra","execute_success"],"condition":"功能入口；基础操作免费，或现有权益已覆盖本次需求","treatment":"绕过选购与付款，回到目标操作","next":"本例无额外消耗；执行成功才算完成"},{"id":"path-1","display_name":"公共入口：已购且可用","kind":"journey","nodes":["public","continue","execute","goal"],"edges":["public_usable","no_extra","execute_success"],"condition":"从公共入口准备使用，已有适用权益且功能可用","treatment":"直接打开已购功能","next":"本例无额外消耗；执行成功才算完成"},{"id":"path-2","display_name":"功能入口：购买后继续","kind":"journey","nodes":["functional","rights","selection","order","payment","use_check","continue","execute","goal"],"edges":["functional_rights","rights_missing","selection_order","order_submit","payment_paid","use_available","no_extra","execute_success"],"condition":"已确认本次操作需要购买，且存在适用商品","treatment":"选购并确认订单；付款成功后判断使用状态","next":"本例付款与使用均已确认、无额外消耗；执行成功后完成"},{"id":"path-3","display_name":"公共入口：主动购买后使用","kind":"journey","nodes":["public","selection","order","payment","use_check","continue","execute","goal"],"edges":["public_buy","selection_order","order_submit","payment_paid","use_available","no_extra","execute_success"],"condition":"用户主动了解商品并决定购买","treatment":"选购、确认订单与付款；可用后打开已购功能","next":"本例付款与使用均已确认、无额外消耗；执行成功后完成"},{"id":"path-4","display_name":"权益或用量未确认：先核对","kind":"branch","nodes":["rights","rights_check","rights"],"edges":["rights_unknown","rights_recheck"],"condition":"状态不明确，影响当前操作","treatment":"核对账号权益与用量，不按免费或未购买处理","next":"核对后再判断：可用则继续，确认缺少时再选购"},{"id":"path-5","display_name":"核对仍无结果：返回后再核对","kind":"branch","nodes":["rights_check","rights_exit","rights_check"],"edges":["rights_unresolved","rights_resume"],"condition":"本次核对后仍无法确认是否可用","treatment":"按来源返回，保留实际可用方式","next":"再次准备使用时核对；退出不表示任务完成"},{"id":"path-6","display_name":"不购买或无适用商品：按来源返回","kind":"branch","nodes":["selection","selection_exit"],"edges":["no_purchase"],"condition":"用户主动不购买，或没有符合当前需求的适用商品","trea 5fUaIFbc"},{"label":"行业实践：日本与美国用户的购买决策差异","url":"https://subclub.com/episode/how-mojo-increased-arpu-60-in-just-five-months-michal-parizek-mojo"}]},"order":{"summary":"提交前确认所购内容、本次扣款及适用的续费和取消条件。","when":"商品和时长已经选择，进入结账页时。","rules":["列明商品名称、购买时长、赠期及权益有效期。","明确本次实付金额、币种、优惠构成及生效条件。","存在自动续费时，说明后续扣费日期、金额和周期；适用时提供续费提醒、取消生效时间及退款或剩余分期规则。","存在加购、赠送时长或订阅试用时，分别说明计费、获得内容、有效期与首次扣款条件。","提交按钮准确表达实际操作与金额；返回修改与完整条款保持清楚。"],"source":"4.3、4.4","figures":["18","19","20-1","20-2","16-2","17"],"ruleSource":[{"blockId":"PODmanUMYCjg","section":"4.4","text":"商品名称、购买时长"},{"blockId":"UvEeHTolPlHT","section":"4.4","text":"实际扣款金额、币种"},{"blockId":"xjOBDjGPJmwO","section":"4.4","text":"适用的扣费日期、金额与周期"},{"blockId":"WIwqPkRRadKo","section":"4.4","text":"关键购买条件、完整条款及提交操作"},{"blockId":"NYAzZpjrvvQU","section":"4.4","text":"有适用优惠时，说明减免金额、金额构成与生效条件"}]},"use_check":{"summary":"付款确认后仍要判断相关权益和目标功能是否可用。","when":"付款已确认，需要判断所购权益和目标功能是否可用时。","rules":["付款成功不等于功能可用。","已确认可用：按来源继续。","尚未确认或仍受限：按实际原因核对和处理。"],"source":"5.3、5.4","figures":["28-2","29-2","30-3"],"ruleSource":[{"blockId":"wrAeguZFvSVt","section":"5.4","text":"付款已确认：可用时直接继续；未确认或受限、影响下一步时，说明状态与相关限制"},{"blockId":"KIlYVeeHXa","section":"5.4","text":"可用时直接继续，核对后同步更新状态与操作"}]},"resolve":{"summary":"已付款却不能用时，先核对原购买，不直接让用户再次购买。","when":"付款已确认，但尚未确认功能可用，或已确认受限时。","rules":["尚未确认时先核对；已确认受限时，区分商品不覆盖、未生效、未同步及用量不足。","原因未明时，保留订单及实际支持的查询或求助入口。","处理后复查；只有确认缺少权益且有适用商品时才引导选购。"],"source":"5.3、5.4","figures":["31"],"ruleSource":[{"blockId":"IBZdtbpdOWpy","section":"5.4","text":"先核对原购买内容、账号权益与功能状态"},{"blockId":"RfGmPkXphECe","section":"5.4","text":"按商品不覆盖、权益未生效、客户端未同步、用量不足分别处理"},{"blockId":"eGKiOjLQXCGh","section":"5.4","text":"原因未明时保留订单，提供支持的查询或求助"},{"blockId":"RzwtYmMzhxtV","section":"5.4","text":"确认缺少所需权益且有适用商品时，才提供选购"}]},"use_exit":{"summary":"暂时无法使用时，保留后续查询、再次检查或求助入口。","when":"使用问题尚未解决，或仍未确认是否可用时。","rules":["退出不是任务完成。","保留原订单与实际支持的查询或求助方式。","适用时保留订单、订阅管理及发票入口，便于后续核对。","下一次进入时重新检查使用状态。"],"source":"5.3、5.4","figures":["31"],"ruleSource":[{"blockId":"eGKiOjLQXCGh","sectio function pathName(i){return pathLabels[i]||DATA.paths[i].display_name}
function business(i){return pathBusiness[i]||{result:pathResult(DATA.paths[i]),risk:'待维护',validation:'产品用例未执行',updatedAt:'2026-10-27'}}
let focus=2,currentNode='functional',pendingNode=null;let detailReturn={path:null,node:null};const $=id=>document.getElementById(id);
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function stageIndex(id){return nodeStage.has(id)?nodeStage.get(id):0}
function runs(path){const out=[];path.nodes.forEach((node,index)=>{const si=stageIndex(node);let run=out.at(-1);if(!run||run.si!==si){run={si,nodes:[]};out.push(run)}run.nodes.push({node,index})});return out}
function renderLibrary(){const tree=$('tree');tree.replaceChildren();mainScenes.forEach((scene,displayIndex)=>{const i=scene.index,row=el('div','path-item'+(i===focus?' current':'')),main=el('button','path-main');row.setAttribute('role','listitem');main.type='button';main.dataset.path=String(i);main.setAttribute('aria-current',i===focus?'page':'false');const meta=el('div','path-meta');meta.append(el('span','path-number',String(displayIndex+1).padStart(2,'0')),el('span','path-entry',scene.entry));main.append(meta,el('strong','path-action path-action-full',scene.action));const short=el('span','path-action-short',scene.short||scene.action);short.setAttribute('aria-hidden','true');main.append(short);row.append(main);if(i===focus)row.append(el('span','path-current-badge','当前'));tree.append(row)});$('library-count').textContent=mainScenes.length+' 个'}
function pathResult(p){return DATA.titles[p.nodes.at(-1)]||p.next}
function renderScenario(){const p=DATA.paths[focus];$('journey-primary-title').textContent=pathName(focus);$('journey-meta').textContent=p.nodes.length+' 步 · '+new Set(p.nodes.map(stageIndex)).size+' 阶段';$('scenario-condition').textContent=p.condition;$('scenario-result').textContent=pathResult(p);$('scenario-treatment').textContent=p.treatment;$('scenario-next').textContent=p.next;$('scenario-question').textContent=businessMeta[focus]||'请结合路径摘要和节点规则核对。'}
function makeStep(path,pathIndex,index,stage){const b=el('button','step'+((focus===pathIndex&&index===currentNode)?' selected':''));b.type='button';b.dataset.node=index;b.dataset.path=String(pathIndex);b.setAttribute('aria-label',stage.name+'，'+DATA.titles[index]+'，查看节点详情');const meta=el('span','step-meta');meta.append(el('b','step-index',String(path.nodes.indexOf(index)+1).padStart(2,'0')),el('em','step-stage',stage.name));b.append(meta,el('strong','',DATA.titles[index]));return b}
function renderJourney(){const wrap=$('journey-lanes');wrap.replaceChildren();wrap.classList.remove('is-comparison');wrap.classList.add('is-single');const p=DATA.paths[focus],lane=el('article','lane current'),route=el('div','route'),steps=el('div','steps');p.nodes.forEach((node,index)=>{if(index){const eid=p.edges[index-1],kind=DATA.graph.edges.find(e=>e.id===eid)?.kind||'main';steps.append(el('span','arrow '+kind,kind==='return'?'↺':'→'))}steps.append(makeStep(p,focus,node,stages[stageIndex(node)]))});route.append(steps);lane.append(route);wrap.append(lane)}
function renderPathIndex(){const select=$('path-index-select');if(!select)return;select.replaceChildren();DATA.groups.forEach(group=>{const og=document.createElement('optgroup');og.label=group.name;group.indices.forEach(i=>{const option=document.createElement('option');option.value=String(i);option.textContent=pathName(i);og.append(option)});select.append(og)});select.value=String(focus)}
function renderAll(){renderLibrary();renderScenario();renderPathIndex();renderJourney()}
function switchFocus(i){if(i===focus)return;focus=i;currentNode=DATA.paths[i].nodes[0];history.replaceState(null,'','#path='+i)}
function showRouteNotice(message){const notice=$('route-notice');if(!notice)return;notice.textContent=message;notice.hidden=false}
function figureEvidenceStatus(f){if(f.kind==='experiment')return['experiment','实验结果'];if(f.kind==='scheme')return['scheme','方案示意'];if(f.kind==='draft'||/草案|未上线|占位|待确认/.test(f.caption))return['draft','方案草案'];if(f.kind==='history'||/历史/.test(f.caption))return['history','历史参考'];return['','']}
function evidenceLabel(f){return /^价格实验/.test(f.number)?f.number:'图 '+f.number}
let imageViewerReturn=null;
function openImageViewer(figure){imageViewerReturn=document.activeElement;$('image-viewer-title').textContent='设计证据 · '+evidenceLabel(figure);const img=$('image-viewer-img');img.src=figure.src;img.alt=figure.caption;$('image-viewer-caption').textContent=figure.caption;$('image-viewer').showModal()}
function openDetail(node){
 detailReturn={path:focus,node};currentNode=node;history.replaceState(null,'','#path='+focus+'&node='+node);renderJourney();
 const p=DATA.paths[focus],n=DATA.nodesInfo[node],body=$('drawer-body');
 $('drawer-title').textContent=DATA.titles[node];
 $('drawer-context').textContent='路径 '+String(focus+1).padStart(2,'0')+' · '+stages[stageIndex(node)].name+' · '+pathName(focus);
 body.replaceChildren();
 const overview=el('section','detail-overview');
 overview.append(el('p','detail-summary',n.summary));
 const condition=el('div','detail-condition');condition.append(el('span','detail-label','适用情况'),el('span','',n.when));overview.append(condition);
 const validation=business(focus).validation,unverified=/未执行|未验证|待/.test(validation);
 $('detail-verification').hidden=!unverified;
 $('detail-verification').textContent=validation;

 body.append(overview);
 const rulesSection=el('section','detail-section detail-rules');
 const rulesHead=el('div','detail-section-head');rulesHead.append(el('h3','detail-section-title','关键要求'));rulesSection.append(rulesHead);
 const ul=el('ol','rule-list');n.rules.forEach(text=>{const item=el('li');item.append(el('span','',text));ul.append(item)});rulesSection.append(ul);
 rulesSection.append(el('p','detail-source-note','依据：方案 v6724 · '+(n.source||'未标注')+' · 文档核对 '+DATA.source.checkedAt));body.append(rulesSection);
 const question=el('section','detail-question');question.append(el('span','detail-question-label','待业务确认'),el('p','',businessMeta[focus]||'请结合路径摘要核对。'));body.append(question);
 const evidenceSection=el('section','detail-section detail-evidence');
 const evidenceHead=el('div','evidence-section-head');const evidenceTitle=el('div','detail-section-head');evidenceTitle.append(el('h3','detail-section-title','设计证据'));evidenceHead.append(evidenceTitle,el('span','','来自规则文档 · 点击图片可放大'));evidenceSection.append(evidenceHead);
 if(n.evidenceNote){const note=el('div','detail-evidence-note');note.append(el('strong','','实验结论'),el('span','',n.evidenceNote));evidenceSection.append(note)}if(n.links&&n.links.length){const links=el('div','detail-links');links.append(el('strong','','延伸资料'));n.links.forEach(item=>{const a=document.createElement('a');a.href=item.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=item.label;links.append(a)});evidenceSection.append(links)}
 const figs=el('div','diagram-grid');
 (n.figures||[]).forEach(id=>{const f=DATA.figures[id],state=figureEvidenceStatus(f),fig=document.createElement('figure');fig.className='diagram';const box=el('div','diagram-box',evidenceLabel(f));const cap=el('figcaption');cap.append(el('b','evidence-caption-index',evidenceLabel(f)));if(state[1])cap.append(el('span','evidence-badge kd-tag '+state[0],state[1]));cap.append(el('span','',f.caption.replace(/^图\s*[^｜]+｜\s*/,'')));if(f.src){box.textContent='正在加载设计证据';box.classList.add('diagram-loading');const zoom=el('button','evidence-image-button');zoom.type='button';zoom.setAttribute('aria-label','放大查看 '+evidenceLabel(f));zoom.hidden=true;const img=document.createElement('img');img.alt=f.caption;img.loading='eager';img.decoding='async';img.addEventListener('load',()=>{zoom.hidden=false;box.hidden=true;box.classList.remove('diagram-loading')});img.addEventListener('error',()=>{zoom.remove();box.hidden=false;box.classList.remove('diagram-loading');box.classList.add('diagram-error');box.textContent='图片暂不可用'});zoom.append(img);zoom.addEventListener('click',()=>openImageViewer(f));img.src=f.src;fig.append(zoom,box,cap)}else{fig.append(box,cap)}figs.append(fig)});
 figs.classList.toggle('single',(n.figures||[]).length===1);figs.classList.toggle('pair',(n.figures||[]).length===2);evidenceSection.classList.toggle('evidence-single',(n.figures||[]).length===1);if(!(n.figures||[]).length)figs.append(el('div','evidence-empty','当前节点未附设计小图'));evidenceSection.append(figs);body.append(evidenceSection);
 $('detail-dialog').showModal();document.body.classList.add('modal-open')
}
$('tree').addEventListener('click',e=>{const button=e.target.closest('[data-path].path-main');if(!button)return;const i=+button.dataset.path;switchFocus(i);renderAll();setTimeout(()=>document.querySelector('.path-item.current .path-main')?.focus({preventScroll:true}),0)});
$('journey-lanes').addEventListener('click',e=>{const step=e.target.closest('[data-node]');if(step)openDetail(step.dataset.node)});
$('path-index-select').addEventListener('change',e=>{const i=Number(e.target.value);if(!Number.isInteger(i)||!DATA.paths[i])return;switchFocus(i);history.replaceState(null,'','#path='+i);renderAll()});
$('detail-close').addEventListener('click',()=>$('detail-dialog').close());
$('detail-dialog').addEventListener('close',()=>{document.body.classList.remove('modal-open');history.replaceState(null,'','#path='+focus);const trigger=document.querySelector('[data-node="'+detailReturn.node+'"][data-path="'+detailReturn.path+'"]');if(trigger)trigger.focus({preventScroll:true})});
$('node-copy').addEventListener('click',async()=>{const button=$('node-copy');try{await copyText(location.href.split('#')[0]+'#path='+focus+'&node='+detailReturn.node);button.textContent='已复制'}catch{button.textContent='复制失败'}setTimeout(()=>button.textContent='复制节点',1400)});
$('detail-dialog').addEventListener('click',e=>{if(e.target===$('detail-dialog'))$('detail-dialog').close()});
$('image-viewer-close').addEventListener('click',()=>$('image-viewer').close());
$('image-viewer').addEventListener('click',e=>{if(e.target===$('image-viewer'))$('image-viewer').close()});
$('image-viewer').addEventListener('close',()=>{if(imageViewerReturn&&imageViewerReturn.isConnected)imageViewerReturn.focus({preventScroll:true})});
const copyText=async text=>{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return}const area=document.createElement('textarea');area.value=text;area.setAttribute('readonly','');area.style.position='fixed';area.style.opacity='0';document.body.append(area);area.select();const ok=document.execCommand('copy');area.remove();if(!ok)throw new Error('copy failed')};
$('copy-link').addEventListener('click',async()=>{try{await copyText(location.href.split('#')[0]+'#path='+focus);$('copy-link').textContent='已复制'}catch{$('copy-link').textContent='复制失败'}setTimeout(()=>$('copy-link').textContent='复制当前路径',1400)});
function restorePathFromHash(){if(!location.hash)return false;const match=location.hash.match(/^#path=(\d+)(?:&node=([a-z_]+))?$/);if(!match){showRouteNotice('链接中的路径无效，已显示默认路径。');return false}const i=Number(match[1]);if(!Number.isInteger(i)||!DATA.paths[i]){showRouteNotice('链接中的路径不存在，已显示默认路径。');return false}focus=i;pendingNode=match[2]||null;currentNode=DATA.paths[i].nodes[0];return true}
window.addEventListener('hashchange',()=>{if(restorePathFromHash()){renderAll();if(pendingNode){if(DATA.paths[focus].nodes.includes(pendingNode)){const node=pendingNode;pendingNode=null;setTimeout(()=>openDetail(node),0)}else{showRouteNotice('链接中的节点不属于当前路径，已打开路径概览。');pendingNode=null}}}});
const hasDeepLink=restorePathFromHash();
renderAll();
if(pendingNode){if(DATA.paths[focus].nodes.includes(pendingNode)){const node=pendingNode;pendingNode=null;setTimeout(()=>openDetail(node),0)}else{showRouteNotice('链接中的节点不属于当前路径，已打开路径概览。');pendingNode=null}}
})();
</script>
